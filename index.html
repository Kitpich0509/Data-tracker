<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Money Tracker Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap" rel="stylesheet">


</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2>💰 Money Tracker</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="cards">
    <div class="card income">💵 <span id="income">0</span></div>
    <div class="card expense">💸 <span id="expense">0</span></div>
    <div class="card profit">📈 <span id="profit">0</span></div>
  </div>

  <input type="month" id="reportMonth" style="width: 150px; height: 15px;">
  <button onclick="exportPDF()">📄 Export Report</button>

  <div id="transactions"></div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>Add</h3>
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <input id="amount" placeholder="Amount">
      <input id="category" placeholder="Category">
      <input id="source" placeholder="Source">
      <button onclick="addTransaction()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <button class="fab" onclick="openModal()">+</button>

  <div class="nav">
    <button onclick="loadTransactions()">🏠</button>
    <button onclick="logout()">🚪</button>
  </div>
</div>

<!-- PDF hidden -->
<div id="pdfContent" style="display:none;"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
